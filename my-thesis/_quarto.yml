project:
  type: book
  output-dir: _output

book:
  title: "Skripsi DTNTF FT UGM"
  chapters:
    - index.qmd
    - frontmatter/cover.qmd
    - frontmatter/pernyataan.qmd
    - frontmatter/pengesahan.qmd
    - frontmatter/persembahan.qmd
    - frontmatter/motto.qmd
    - frontmatter/pengantar.qmd
    - frontmatter/lambang-singkatan.qmd
    - frontmatter/intisari.qmd
    - frontmatter/abstract.qmd
    - bab1-pendahuluan.qmd
    - bab2-tinjauan-pustaka.qmd
    - bab3-dasar-teori.qmd
    - bab4-metodologi.qmd
    - bab5-hasil-pembahasan.qmd
    - bab6-kesimpulan-saran.qmd
  appendices:
    - lampiran/lampiran-a.qmd
    - lampiran/lampiran-b.qmd

bibliography: references.bib
csl: ieee.csl # Follows DTNTF IEEE bracketed convention [1]

crossref:
  fig-title: "Gambar"
  tbl-title: "Tabel"
  fig-prefix: "Gambar"
  tbl-prefix: "Tabel"
  eq-prefix: "Persamaan"

format:
  pdf:
    documentclass: report
    papersize: a4
    classoption: [12pt, oneside]
    pdf-engine: xelatex # Recommended for loading Times New Roman smoothly
    mainfont: "Times New Roman"
    geometry:
      - a4paper
      - top=40mm
      - bottom=30mm
      - left=40mm
      - right=30mm
    linestretch: 1.5 # 1.5 Line Spacing requirement
    indent: 1cm      # 1 cm first-line indent
    toc: true
    toc-depth: 3
    toc-title: "DAFTAR ISI"
    lof: true
    lot: true
    include-in-header:
      - custom-preamble.tex